<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F7FCFD"/><stop offset=".55" stop-color="#E4F2F7"/><stop offset="1" stop-color="#CDEFE8"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#2DD4BF" stop-opacity=".25"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#195E70" stroke-opacity=".09"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="28" fill="#EAF6F8"/><rect width="1200" height="400" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="398" rx="27" stroke="#176B78" stroke-opacity=".25" stroke-width="2"/>

  <circle cx="78" cy="54" r="5" fill="#0F9F94"/><text x="97" y="60" fill="#176B78" font-size="14" font-family="ui-monospace,monospace" letter-spacing="3">PROFILE / 2026</text>
  <text x="74" y="148" fill="#102A3D" font-size="72" font-family="DM Serif Display,Georgia,serif">Lan Anh</text>
  <text x="76" y="187" fill="#376779" font-size="14" font-family="Inter,Arial,sans-serif" letter-spacing="3">PRODUCT SYSTEMS · APPLIED AI</text>
  <text x="76" y="242" fill="#16384A" font-size="25" font-family="Inter,Arial,sans-serif" font-weight="600">I build products where AI has to earn trust.</text>
  <text x="76" y="279" fill="#4B7180" font-size="16" font-family="Inter,Arial,sans-serif">Useful behavior. Explicit state. Structured results. Human control.</text>
  <g font-family="ui-monospace,monospace" font-size="12">
    <rect x="76" y="323" width="150" height="30" rx="4" fill="#102C48" stroke="#60A5FA"/><text x="97" y="343" fill="#A8D2FF">PRODUCT LOGIC</text>
    <rect x="238" y="323" width="174" height="30" rx="4" fill="#0D393B" stroke="#2DD4BF"/><text x="259" y="343" fill="#8BE4D7">MODEL CONTRACTS</text>
    <rect x="424" y="323" width="166" height="30" rx="4" fill="#2F2A1B" stroke="#FBBF24"/><text x="445" y="343" fill="#FCD77C">HUMAN REVIEW</text>
  </g>
  <path d="M676 48V352" stroke="#176B78" stroke-opacity=".22" stroke-dasharray="3 9"/>
  <text x="704" y="70" fill="#427080" font-size="11" font-family="ui-monospace,monospace" letter-spacing="2">BUILD MODE / ACTIVE</text>

  <g shape-rendering="crispEdges">
    <rect x="721" y="104" width="8" height="8" fill="#60A5FA"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="747" y="92" width="6" height="6" fill="#2DD4BF"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="1130" y="112" width="8" height="8" fill="#FBBF24"><animate attributeName="opacity" values=".15;.9;.15" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="1104" y="300" width="6" height="6" fill="#60A5FA"><animate attributeName="y" values="300;286;300" dur="3s" repeatCount="indefinite"/></rect>
  </g>

  <g shape-rendering="crispEdges">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.2s" repeatCount="indefinite"/>
    <ellipse cx="920" cy="365" rx="158" ry="13" fill="#2DD4BF" fill-opacity=".16"/>
    <!-- chair -->
    <rect x="1028" y="242" width="20" height="94" fill="#102C48"/><rect x="1018" y="252" width="12" height="72" fill="#1E4A63"/><rect x="1008" y="324" width="52" height="12" fill="#173A50"/><rect x="1030" y="336" width="10" height="26" fill="#60A5FA"/>
    <!-- hair -->
    <rect x="858" y="94" width="112" height="18" fill="#132033"/><rect x="840" y="112" width="148" height="36" fill="#17283A"/><rect x="822" y="130" width="166" height="84" fill="#132033"/><rect x="822" y="148" width="24" height="84" fill="#17283A"/><rect x="970" y="130" width="24" height="102" fill="#17283A"/><rect x="842" y="202" width="32" height="30" fill="#17283A"/><rect x="946" y="202" width="32" height="30" fill="#17283A"/>
    <!-- face -->
    <rect x="846" y="130" width="124" height="18" fill="#F4B893"/><rect x="838" y="148" width="140" height="54" fill="#F7C3A1"/><rect x="854" y="202" width="108" height="18" fill="#EFAE89"/><rect x="870" y="220" width="76" height="12" fill="#EFAE89"/>
    <!-- fringe -->
    <rect x="846" y="112" width="124" height="18" fill="#17283A"/><rect x="846" y="126" width="34" height="22" fill="#17283A"/><rect x="932" y="126" width="38" height="20" fill="#17283A"/><rect x="880" y="124" width="20" height="12" fill="#1F3446"/>
    <!-- glasses -->
    <g fill="#73E8E0"><rect x="848" y="154" width="52" height="6"/><rect x="848" y="160" width="6" height="34"/><rect x="894" y="160" width="6" height="34"/><rect x="848" y="194" width="52" height="6"/><rect x="916" y="154" width="52" height="6"/><rect x="916" y="160" width="6" height="34"/><rect x="962" y="160" width="6" height="34"/><rect x="916" y="194" width="52" height="6"/><rect x="900" y="168" width="16" height="6"/></g>
    <!-- blinking eyes -->
    <g fill="#152235"><rect x="866" y="172" width="16" height="8"><animate attributeName="height" values="8;8;2;8" keyTimes="0;.86;.9;1" dur="4.4s" repeatCount="indefinite"/></rect><rect x="934" y="172" width="16" height="8"><animate attributeName="height" values="8;8;2;8" keyTimes="0;.86;.9;1" dur="4.4s" repeatCount="indefinite"/></rect></g>
    <rect x="898" y="202" width="22" height="6" fill="#B65D69"/>
    <!-- hoodie -->
    <rect x="822" y="244" width="168" height="94" fill="#0F766E"/><rect x="838" y="232" width="140" height="28" fill="#115E59"/><rect x="802" y="262" width="28" height="70" fill="#0F766E"/><rect x="990" y="262" width="28" height="70" fill="#0F766E"/><rect x="854" y="244" width="14" height="54" fill="#5EEAD4"/><rect x="948" y="244" width="14" height="54" fill="#5EEAD4"/>
    <rect x="808" y="316" width="42" height="20" fill="#F4B893"/><rect x="970" y="316" width="42" height="20" fill="#F4B893"/>
    <!-- laptop -->
    <rect x="792" y="270" width="232" height="82" fill="#263C55"/><rect x="804" y="282" width="208" height="58" fill="#071827"/><rect x="876" y="298" width="64" height="8" fill="#2DD4BF"/><rect x="892" y="314" width="32" height="8" fill="#60A5FA"><animate attributeName="fill" values="#60A5FA;#FBBF24;#2DD4BF;#60A5FA" dur="2.2s" repeatCount="indefinite"/></rect><rect x="776" y="352" width="264" height="12" fill="#3D5873"/><rect x="896" y="352" width="26" height="6" fill="#8BA7BC"/>
  </g>

  <g font-family="ui-monospace,monospace" font-size="10" letter-spacing="1">
    <path d="M744 142H810" stroke="#60A5FA" stroke-dasharray="4 5"/><text x="700" y="146" fill="#8DBBEA">CONTEXT</text>
    <path d="M1006 102H1086" stroke="#2DD4BF" stroke-dasharray="4 5"/><text x="1094" y="106" fill="#82DFD3">EVALUATE</text>
    <path d="M1038 222H1108" stroke="#FBBF24" stroke-dasharray="4 5"/><text x="1116" y="226" fill="#F4CA68">REVIEW</text>
